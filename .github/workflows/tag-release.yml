# Releases only what Nico tested and approved.
# Day-to-day work goes to main (no release). After his OK, main is pushed to
# the "release" branch -> this creates tag v<version> from WarlockPetAndProcManagement.toc (once),
# and CurseForge's "tagged commits" packaging builds the zip.
name: Tag new version

on:
  push:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create tag from the toc version
        run: |
          version=$(grep -m1 '^## Version:' WarlockPetAndProcManagement.toc | sed 's/^## Version:[[:space:]]*//' | tr -d '\r[:space:]')
          if [ -z "$version" ]; then echo "No version in WarlockPetAndProcManagement.toc"; exit 1; fi
          tag="v$version"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists, nothing to do"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "Warlock Pet & Proc Management $version"
          git push origin "$tag"
          echo "Created $tag"
